name: Check PR
on:
  push:
    branches: [develop]
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "zulu"
      - name: Build
        run: ./gradlew --no-daemon build
